name: The Agent – triage

# Triage only: asks Jev (TypeSafe AI, through Vercel AI Gateway) whether each issue is ready for
# the agent and which tier it needs. It posts nothing to GitHub and runs no engine.
# See .agent/README.md ("Triage with Jev").

on:
  workflow_dispatch:
    inputs:
      issues:
        description: "Issue numbers: a list (1,2,5), a range (1-8), or both (1-3,7)"
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: the-agent-triage
  cancel-in-progress: false

jobs:
  triage:
    name: "Triage issues ${{ inputs.issues }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OUT: ${{ github.workspace }}/triage-out
      REPO: ${{ github.repository }}
      ISSUES: ${{ inputs.issues }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Sparse checkout keeps the files at the repository root, so AGENTS.md is there
      # for triage.py to describe the project from.
      - name: Check out the runner
        uses: actions/checkout@v4
        with:
          sparse-checkout: .agent
          persist-credentials: false

      - name: Read the issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUT/issues"
          numbers="$(python3 - <<'EOF'
          import os, re, sys
          spec = os.environ["ISSUES"].replace(" ", "")
          out = []
          for part in filter(None, spec.split(",")):
              m = re.fullmatch(r"(\d+)(?:-(\d+))?", part)
              if not m:
                  sys.exit(f"::error title=Triage::Not an issue number or range: {part}")
              lo, hi = int(m[1]), int(m[2] or m[1])
              if hi < lo or hi - lo > 50:
                  sys.exit(f"::error title=Triage::Range too large or reversed: {part}")
              out += [n for n in range(lo, hi + 1) if n not in out]
          print(" ".join(map(str, out)))
          EOF
          )"
          for n in $numbers; do
            gh api "repos/$REPO/issues/$n" > "$OUT/issues/$n.json"
          done
          echo "Read issues: $numbers"

      - name: Triage with Jev
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: python3 .agent/triage.py "$OUT" "$OUT"/issues/*.json

      - name: Upload the triage record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-${{ github.run_id }}
          path: |
            triage-out/triage.json
            triage-out/summary.md
          if-no-files-found: ignore
