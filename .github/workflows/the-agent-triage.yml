name: The Agent – triage

# Triage only: asks a judge model whether each issue is ready for the agent and which tier it
# needs. The judge is Claude Haiku (no tools) or Jev (TypeSafe AI, through Vercel AI Gateway).
# It posts nothing to GitHub and runs no engine. See .agent/README.md ("Triage").

on:
  workflow_dispatch:
    inputs:
      issues:
        description: "Any issue numbers, as a list, range, or both: e.g. 12 or 3,17,40 or 20-45 or 1-3,7 (up to 51 per range)"
        required: true
        type: string
      judge:
        description: "haiku: Claude Haiku with no tools | jev: Jev through Vercel AI Gateway (needs paid credits)"
        type: choice
        options: [haiku, jev]
        default: haiku

permissions:
  contents: read
  issues: read

concurrency:
  group: the-agent-triage
  cancel-in-progress: false

jobs:
  triage:
    name: "Triage issues ${{ inputs.issues }} (${{ inputs.judge }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30          # Haiku through Claude Code takes about 20-30 seconds per issue
    env:
      OUT: ${{ github.workspace }}/triage-out
      REPO: ${{ github.repository }}
      ISSUES: ${{ inputs.issues }}
      JUDGE: ${{ inputs.judge }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Sparse checkout keeps the files at the repository root, so AGENTS.md is there
      # for triage.py to describe the project from.
      - name: Check out the runner
        uses: actions/checkout@v4
        with:
          sparse-checkout: .agent
          persist-credentials: false

      - name: Read the issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUT/issues"
          numbers="$(python3 - <<'EOF'
          import os, re, sys
          spec = os.environ["ISSUES"].replace(" ", "")
          out = []
          for part in filter(None, spec.split(",")):
              m = re.fullmatch(r"(\d+)(?:-(\d+))?", part)
              if not m:
                  sys.exit(f"::error title=Triage::Not an issue number or range: {part}")
              lo, hi = int(m[1]), int(m[2] or m[1])
              if hi < lo or hi - lo > 50:
                  sys.exit(f"::error title=Triage::Range too large or reversed: {part}")
              out += [n for n in range(lo, hi + 1) if n not in out]
          print(" ".join(map(str, out)))
          EOF
          )"
          found=""
          missing=""
          for n in $numbers; do
            if gh api "repos/$REPO/issues/$n" > "$OUT/issues/$n.json" 2> "$OUT/gh-error.txt"; then
              found="$found $n"
            elif grep -qE 'HTTP (404|410)' "$OUT/gh-error.txt"; then
              # 404: no issue or PR has this number. 410: the issue was deleted.
              rm -f "$OUT/issues/$n.json"
              missing="$missing $n"
            else
              cat "$OUT/gh-error.txt" >&2
              echo "::error title=Triage::Could not read issue #$n from GitHub"
              exit 1
            fi
          done
          rm -f "$OUT/gh-error.txt"
          if [ -n "$missing" ]; then
            echo "::warning title=Issues not found::Skipped, no such issue:$missing"
          fi
          if [ -z "$found" ]; then
            echo "::error title=Triage::None of the requested issues exist ($ISSUES)"
            exit 1
          fi
          echo "Read issues:$found"

      - name: Set up Node 22 (for Claude Code)
        if: inputs.judge == 'haiku'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The judge gets only its own credential.
      - name: Triage
        env:
          GATEWAY_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Strip spaces and line breaks: a credential copied from a wrapped terminal line is a common mistake.
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          case "$JUDGE" in
            jev)
              AI_GATEWAY_API_KEY="$(clean "$GATEWAY_KEY")"; export AI_GATEWAY_API_KEY
              ;;
            haiku)
              if [ -n "$API_KEY" ]; then
                ANTHROPIC_API_KEY="$(clean "$API_KEY")"; export ANTHROPIC_API_KEY
              elif [ -n "$OAUTH_TOKEN" ]; then
                CLAUDE_CODE_OAUTH_TOKEN="$(clean "$OAUTH_TOKEN")"; export CLAUDE_CODE_OAUTH_TOKEN
              else
                echo "::error title=Triage::Add a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret."
                exit 1
              fi
              npm install -g --silent @anthropic-ai/claude-code
              claude --version
              ;;
          esac
          unset GATEWAY_KEY OAUTH_TOKEN API_KEY
          python3 .agent/triage.py --judge "$JUDGE" "$OUT" "$OUT"/issues/*.json

      - name: Upload the triage record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-${{ inputs.judge }}-${{ github.run_id }}
          path: |
            triage-out/triage.json
            triage-out/summary.md
          if-no-files-found: ignore
