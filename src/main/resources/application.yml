spring:
  application:
    name: freightline
  datasource:
    url: jdbc:h2:mem:freightline;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

server:
  port: 8080
