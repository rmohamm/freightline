name: The Agent

# Runner v0: fix one GitHub issue and open a pull request.
# Start it from the Actions tab: The Agent -> Run workflow -> enter an issue number.
# See .agent/README.md for how it works and what it needs.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to fix
        required: true
        type: number
      engine:
        description: Coding engine
        type: choice
        options: [claude]
        default: claude
      tier:
        description: "fast: small model, lean process | standard | deep: largest model, plan first"
        type: choice
        options: [fast, standard, deep]
        default: standard

# The workflow's own token can only read. Everything that writes to GitHub
# uses a short-lived token from The Agent's GitHub App instead.
permissions:
  contents: read

concurrency:
  group: the-agent-issue-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  run:
    name: "Issue #${{ inputs.issue }} (${{ inputs.engine }}, ${{ inputs.tier }})"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ISSUE: ${{ inputs.issue }}
      ENGINE: ${{ inputs.engine }}
      TIER: ${{ inputs.tier }}
      OUT: ${{ github.workspace }}/.agent-out
      REPO: ${{ github.repository }}
      BRANCH: the-agent/issue-${{ inputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get a token for The Agent's GitHub App
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Read the issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p "$OUT"
          gh api "repos/$REPO/issues/$ISSUE" > "$OUT/issue.json"
          python3 .agent/runner.py check-issue "$OUT/issue.json"

      - name: Load tier settings
        id: tier
        run: python3 .agent/runner.py tier "$TIER" >> "$GITHUB_OUTPUT"

      - name: Comment that The Agent has started
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body \
            "**The Agent is working on this issue** (engine: $ENGINE, tier: $TIER). [Follow the run]($RUN_URL)"

      - name: Check that main passes its tests before any changes
        run: mvn -B -q test

      - name: Prepare the workspace
        run: |
          # Run output and the per-run skill copy are never committed.
          printf '.agent-out/\n.claude/\n' >> .git/info/exclude
          mkdir -p .claude/skills
          IFS=',' read -ra SKILLS <<< "${{ steps.tier.outputs.skills }}"
          for skill in "${SKILLS[@]}"; do
            cp -r ".agent/skills/$skill" .claude/skills/
          done
          python3 .agent/runner.py prompt "$OUT/issue.json" "$TIER" > "$OUT/prompt.md"
          echo "Skills for this run: ${SKILLS[*]}"

      # The engine gets the code and its model credential, and nothing else:
      # no GitHub token is in its environment.
      - name: Run the engine (Claude Code)
        if: inputs.engine == 'claude'
        timeout-minutes: 35
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            export ANTHROPIC_API_KEY="$API_KEY"
          elif [ -n "$OAUTH_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
          else
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret."
            exit 1
          fi
          unset API_KEY OAUTH_TOKEN

          npm install -g @anthropic-ai/claude-code
          claude --version

          set +e
          claude -p "$(cat "$OUT/prompt.md")" \
            --model "${{ steps.tier.outputs.model }}" \
            --max-turns "${{ steps.tier.outputs.max_turns }}" \
            --permission-mode dontAsk \
            --permission-prompts none \
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,TodoWrite,Bash(mvn *)" \
            --output-format json > "$OUT/engine-result.json"
          echo "Engine exit code: $?"
          exit 0

      - name: Verify the change independently
        id: verify
        run: |
          set +e
          mvn -B test > "$OUT/verify.log" 2>&1
          code=$?
          tail -n 25 "$OUT/verify.log"
          if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Collect the changes
        run: |
          git add -A
          git diff --cached --numstat > "$OUT/numstat.txt"
          echo "Changed files:"
          git diff --cached --name-only

      - name: Decide the outcome and write the report
        id: report
        env:
          TESTS_PASSED: ${{ steps.verify.outputs.passed }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 .agent/runner.py report

      - name: Push the branch and open the pull request
        id: pr
        if: steps.report.outputs.outcome == 'pr_ready' || steps.report.outputs.outcome == 'pr_draft'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          OUTCOME: ${{ steps.report.outputs.outcome }}
        run: |
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -q -F "$OUT/commit-msg.txt"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

          title=$(head -n 1 "$OUT/commit-msg.txt")
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file "$OUT/pr-body.md"
            if [ "$OUTCOME" = "pr_draft" ]; then
              gh pr ready "$existing" --repo "$REPO" --undo || true
            else
              gh pr ready "$existing" --repo "$REPO" || true
            fi
            url=$(gh pr view "$existing" --repo "$REPO" --json url --jq .url)
          else
            draft_flag=""
            if [ "$OUTCOME" = "pr_draft" ]; then draft_flag="--draft"; fi
            url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "$title" --body-file "$OUT/pr-body.md" $draft_flag)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          python3 - "$url" <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["OUT"], "record.json")
          record = json.load(open(path))
          record["pr_url"] = sys.argv[1]
          json.dump(record, open(path, "w"), indent=2)
          PY
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report back on the issue
        if: always() && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUTCOME: ${{ steps.report.outputs.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -n "$PR_URL" ]; then
            if [ "$OUTCOME" = "pr_draft" ]; then
              body="**The Agent opened a draft pull request: $PR_URL** The independent test run failed, so it needs a closer look."
            else
              body="**The Agent opened a pull request: $PR_URL** Tests pass; it's ready for review."
            fi
          elif [ -s "$OUT/comment.md" ] && [ -n "$OUTCOME" ]; then
            body=$(cat "$OUT/comment.md")
          else
            body="**The Agent's run failed before it finished.** [Run log]($RUN_URL)"
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "$body"

      - name: Save the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-agent-issue-${{ inputs.issue }}-run-${{ github.run_id }}
          path: |
            .agent-out/record.json
            .agent-out/report.md
            .agent-out/status
            .agent-out/prompt.md
            .agent-out/engine-result.json
            .agent-out/verify.log
            .agent-out/pr-body.md
          if-no-files-found: ignore

      - name: Fail the job when the run didn't work
        if: steps.report.outputs.outcome == 'engine_error' || steps.report.outputs.outcome == 'blocked'
        run: |
          echo "::error::Outcome: ${{ steps.report.outputs.outcome }}. See the issue comment and the run record."
          exit 1
