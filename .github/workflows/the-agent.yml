name: The Agent

# Runner v0.3: fix one GitHub issue and open a pull request.
# Start it from the Actions tab (The Agent -> Run workflow), or add the `agent-ready` label to an issue.
# See .agent/README.md for how it works and what it needs.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to fix
        required: true
        type: number
      engine:
        description: Coding engine
        type: choice
        options: [claude, gemini]
        default: claude
      tier:
        description: "fast: small model, lean process | standard | deep: largest model, plan first"
        type: choice
        options: [fast, standard, deep]
        default: standard
      base:
        description: "Branch the agent works on and opens its PR against (eval/baseline for comparisons)"
        type: string
        default: main
  issues:
    types: [labeled]

# The workflow's own token can only read. Everything that writes to GitHub
# uses a short-lived token from The Agent's GitHub App instead.
permissions:
  contents: read

concurrency:
  group: the-agent-${{ inputs.issue || github.event.issue.number }}-${{ inputs.engine || 'claude' }}-${{ inputs.tier || 'standard' }}-${{ inputs.base || 'main' }}
  cancel-in-progress: false

jobs:
  run:
    # Manual runs always go; label events only for the agent-ready label.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-ready'
    name: "Issue #${{ inputs.issue || github.event.issue.number }} (${{ inputs.engine || 'claude' }}, ${{ inputs.tier || 'standard' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ISSUE: ${{ inputs.issue || github.event.issue.number }}
      ENGINE: ${{ inputs.engine || 'claude' }}
      TIER: ${{ inputs.tier || 'standard' }}
      BASE: ${{ inputs.base || 'main' }}
      TRIGGER: ${{ github.event_name }}
      OUT: ${{ github.workspace }}/work/.agent-out
      RUNNER_PY: ${{ github.workspace }}/runner/.agent/runner.py
      SKILLS_DIR: ${{ github.workspace }}/runner/.agent/skills
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        working-directory: work

    steps:
      # The code the agent works on: main, or a fixed baseline branch for comparisons.
      - name: Check out the code to work on
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          path: work
          persist-credentials: false

      # The runner itself always comes from the branch the workflow runs from (main), so a baseline
      # branch can hold only the original code. It sits outside the agent's working folder.
      - name: Check out the runner
        uses: actions/checkout@v4
        with:
          path: runner
          sparse-checkout: .agent
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: work/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get a token for The Agent's GitHub App
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Read the issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p "$OUT"
          gh api "repos/$REPO/issues/$ISSUE" > "$OUT/issue.json"
          # Comparison runs on a baseline branch may use issues already fixed (and closed) on main.
          allow_closed=$([ "$BASE" = "main" ] && echo no || echo yes)
          python3 "$RUNNER_PY" check-issue "$OUT/issue.json" "$allow_closed"

      - name: Load tier settings
        id: tier
        run: python3 "$RUNNER_PY" tier "$TIER" "$ENGINE" >> "$GITHUB_OUTPUT"

      - name: Name the branch
        run: |
          # One branch per issue, engine, tier and base, so comparison runs don't overwrite each other.
          branch="the-agent/issue-${ISSUE}-${ENGINE}-${TIER}"
          if [ "$BASE" != "main" ]; then branch="${branch}-on-${BASE//\//-}"; fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          echo "Branch: $branch"

      - name: Comment that The Agent has started
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body \
            "**The Agent is working on this issue** (engine: $ENGINE, tier: $TIER, base: \`$BASE\`). [Follow the run]($RUN_URL)"

      - name: Check that the base branch passes its tests before any changes
        run: mvn -B -q test

      - name: Prepare the workspace
        run: |
          # Run output and the per-run engine configuration are never committed.
          printf '.agent-out/\n.claude/\n.gemini/\n' >> .git/info/exclude
          IFS=',' read -ra SKILLS <<< "${{ steps.tier.outputs.skills }}"
          case "$ENGINE" in
            claude)
              skills_dest=.claude/skills
              ;;
            gemini)
              # Gemini runs with workspace trust (--skip-trust), so refuse a repository that ships its own
              # Gemini config: it could widen the tool allow-list. Our config goes in the runner's home folder.
              if [ -e .gemini ]; then
                echo "::error::This repository contains a .gemini/ folder; refusing to run Gemini with it."
                exit 1
              fi
              skills_dest="$HOME/.gemini/skills"
              python3 "$RUNNER_PY" gemini-settings "$TIER" > "$HOME/.gemini-settings.json"
              mkdir -p "$HOME/.gemini" && mv "$HOME/.gemini-settings.json" "$HOME/.gemini/settings.json"
              ;;
          esac
          mkdir -p "$skills_dest"
          for skill in "${SKILLS[@]}"; do
            cp -r "$SKILLS_DIR/$skill" "$skills_dest/"
          done
          python3 "$RUNNER_PY" prompt "$OUT/issue.json" "$TIER" > "$OUT/prompt.md"
          echo "Skills for this run: ${SKILLS[*]} (in $skills_dest)"

      # The engine gets the code and its own model credential, and nothing else:
      # no GitHub token and no other engine's credential is in its environment.
      - name: Run the engine
        id: engine
        timeout-minutes: 35
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ steps.tier.outputs.model }}
          MAX_TURNS: ${{ steps.tier.outputs.max_turns }}
        run: |
          # Strip spaces and line breaks: a credential copied from a wrapped terminal line is a common mistake.
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          API_KEY=$(clean "$API_KEY"); OAUTH_TOKEN=$(clean "$OAUTH_TOKEN"); GEMINI_KEY=$(clean "$GEMINI_KEY")

          case "$ENGINE" in
            claude)
              if [ -n "$API_KEY" ]; then
                export ANTHROPIC_API_KEY="$API_KEY"
              elif [ -n "$OAUTH_TOKEN" ]; then
                export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
              else
                echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret."
                exit 1
              fi
              unset API_KEY OAUTH_TOKEN GEMINI_KEY
              npm install -g @anthropic-ai/claude-code
              claude --version
              engine_cmd=(claude -p "$(cat "$OUT/prompt.md")"
                --model "$MODEL"
                --max-turns "$MAX_TURNS"
                --permission-mode dontAsk
                --permission-prompts none
                --allowedTools "Read,Edit,Write,Glob,Grep,Skill,TodoWrite,Bash(mvn *),Bash(./mvnw *)"
                --output-format json)
              ;;
            gemini)
              if [ -z "$GEMINI_KEY" ]; then
                echo "::error::Add a GEMINI_API_KEY repository secret."
                exit 1
              fi
              export GEMINI_API_KEY="$GEMINI_KEY"
              unset API_KEY OAUTH_TOKEN GEMINI_KEY
              npm install -g @google/gemini-cli
              gemini --version
              # YOLO approves tool calls automatically; the tool allow-list in ~/.gemini/settings.json
              # decides which tools exist at all (file tools, and the shell only for mvn).
              engine_cmd=(gemini -p "$(cat "$OUT/prompt.md")"
                --model "$MODEL"
                --approval-mode yolo
                --skip-trust
                --output-format json)
              ;;
            *)
              echo "::error::Unknown engine: $ENGINE"
              exit 1
              ;;
          esac

          # Every engine's exit code, stderr, and wall-clock time are saved, so even an unfamiliar
          # failure explains itself and every engine can be timed the same way.
          set +e
          start=$(date +%s%3N)
          "${engine_cmd[@]}" > "$OUT/engine-result.json" 2> >(tee "$OUT/engine-stderr.log" >&2)
          code=$?
          echo $(( $(date +%s%3N) - start )) > "$OUT/engine-duration-ms"
          echo "$code" > "$OUT/engine-exit-code"
          echo "Engine exit code: $code"
          exit 0

      - name: Summarize the engine result
        if: always() && steps.engine.outcome != 'skipped' && steps.engine.outcome != ''
        run: python3 "$RUNNER_PY" engine-summary

      - name: Verify the change independently
        id: verify
        run: |
          set +e
          mvn -B test > "$OUT/verify.log" 2>&1
          code=$?
          tail -n 25 "$OUT/verify.log"
          if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Collect the changes
        run: |
          git add -A
          git diff --cached --numstat > "$OUT/numstat.txt"
          echo "Changed files:"
          git diff --cached --name-only

      - name: Decide the outcome and write the report
        id: report
        env:
          TESTS_PASSED: ${{ steps.verify.outputs.passed }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 "$RUNNER_PY" report

      - name: Push the branch and open the pull request
        id: pr
        if: steps.report.outputs.outcome == 'pr_ready' || steps.report.outputs.outcome == 'pr_draft'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          OUTCOME: ${{ steps.report.outputs.outcome }}
        run: |
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -q -F "$OUT/commit-msg.txt"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

          title=$(head -n 1 "$OUT/pr-title.txt")
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file "$OUT/pr-body.md"
            if [ "$OUTCOME" = "pr_draft" ]; then
              gh pr ready "$existing" --repo "$REPO" --undo || true
            else
              gh pr ready "$existing" --repo "$REPO" || true
            fi
            url=$(gh pr view "$existing" --repo "$REPO" --json url --jq .url)
          else
            draft_flag=""
            if [ "$OUTCOME" = "pr_draft" ]; then draft_flag="--draft"; fi
            url=$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
              --title "$title" --body-file "$OUT/pr-body.md" $draft_flag)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          python3 - "$url" <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["OUT"], "record.json")
          record = json.load(open(path))
          record["pr_url"] = sys.argv[1]
          json.dump(record, open(path, "w"), indent=2)
          PY
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report back on the issue
        if: always() && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUTCOME: ${{ steps.report.outputs.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -n "$PR_URL" ]; then
            if [ "$OUTCOME" = "pr_draft" ]; then
              body="**The Agent opened a draft pull request: $PR_URL** The independent test run failed, so it needs a closer look."
            else
              body="**The Agent opened a pull request: $PR_URL** Tests pass; it's ready for review."
            fi
          elif [ -s "$OUT/comment.md" ] && [ -n "$OUTCOME" ]; then
            body=$(cat "$OUT/comment.md")
          else
            body="**The Agent's run failed before it finished.** [Run log]($RUN_URL)"
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "$body"

      - name: Save the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-agent-issue-${{ env.ISSUE }}-${{ env.ENGINE }}-${{ env.TIER }}-run-${{ github.run_id }}
          path: |
            work/.agent-out/record.json
            work/.agent-out/report.md
            work/.agent-out/status
            work/.agent-out/prompt.md
            work/.agent-out/engine-result.json
            work/.agent-out/engine-stderr.log
            work/.agent-out/engine-exit-code
            work/.agent-out/engine-duration-ms
            work/.agent-out/verify.log
            work/.agent-out/pr-body.md
          if-no-files-found: ignore

      - name: Fail the job when the run didn't work
        if: steps.report.outputs.outcome == 'engine_error' || steps.report.outputs.outcome == 'blocked'
        run: |
          echo "::error::Outcome: ${{ steps.report.outputs.outcome }}. See the issue comment and the run record."
          exit 1
